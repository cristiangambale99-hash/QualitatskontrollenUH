        /* ---- Gestaltungssystem: Karten, Buttons, Bewertung, Stepper ---- */
        .card-surface {
          background: #FFFFFF;
          border: 1px solid #E7ECEB;
          border-radius: 18px;
          box-shadow: 0 1px 2px rgba(16,44,42,0.04), 0 10px 24px -16px rgba(16,44,42,0.14);

        }
        button.card-surface:hover, a.card-surface:hover {
          box-shadow: 0 4px 10px rgba(16,44,42,0.06), 0 18px 30px -16px rgba(16,44,42,0.20);
          border-color: #BEE2E9;

          background: linear-gradient(135deg, #2BB6B7 0%, #1E8C8D 100%);

        }

        .btn-primary:active { transform: translateY(0); filter: brightness(0.98); }
        .btn-primary:disabled { filter: grayscale(0.3); opacity: 0.45; box-shadow: none; transform: none; }
        .rating-btn {
          transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease, border-color 0.15s ease;
        }
        .rating-btn:hover { transform: translateY(-1px); }
        .rating-btn.is-active { box-shadow: 0 3px 8px -2px rgba(16,44,42,0.35); }
        .stepper-track { position: relative; }
        .stepper-line {
          position: absolute; left: 0; right: 0; top: 15px; height: 2px;
          background: linear-gradient(90deg, #BEE2E9, #E4F6F6);
          z-index: 0;

        .obj-card-accent { height: 5px; border-radius: 999px 999px 0 0; }
        .input-field {
          border: 1.5px solid #E1E6E4;
