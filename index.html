selezionare il tipo di oggetto \u2014 determina quali moduli di verifica vengono caricati."},anl1P2:{de:'Kontrollart (regul\xE4r, Stichprobe, Nachkontrolle, Reklamation, Objekt\xFCbergabe) w\xE4hlen. Bei \u201EReklamation" \xF6ffnet sich zus\xE4tzlich ein Feld f\xFCr das Reklamationsdatum und den Text der Kunden-E-Mail.',es:"Seleccione el tipo de control (regular, muestreo, control de seguimiento, reclamaci\xF3n, entrega del objeto). Con \xABReclamaci\xF3n\xBB se abre adem\xE1s un campo para la fecha de la reclamaci\xF3n y el texto del correo del cliente.",pt:"Selecione o tipo de controlo (regular, amostragem, controlo de seguimento, reclama\xE7\xE3o, entrega do objeto). Com \xABReclama\xE7\xE3o\xBB abre-se tamb\xE9m um campo para a data da reclama\xE7\xE3o e o texto do e-mail do cliente.",it:"Selezionare il tipo di controllo (regolare, campione, controllo di verifica, reclamo, consegna dell'oggetto). Con \xABReclamo\xBB si apre anche un campo per la data del reclamo e il testo dell'e-mail del cliente."},anl1P3:{de:"Name des Kontrolleurs eintragen und das eingesetzte Reinigungspersonal ausw\xE4hlen (bis zu 4 Personen, aus der Mitarbeiterliste suchbar).",es:"Introduzca el nombre del inspector y seleccione el personal de limpieza asignado (hasta 4 personas, buscable en la lista de empleados).",pt:"Introduza o nome do inspetor e selecione o pessoal de limpeza envolvido (at\xE9 4 pessoas, pesquis\xE1vel na lista de colaboradores).",it:"Inserire il nome dell'ispettore e selezionare il personale delle pulizie impiegato (fino a 4 persone, ricercabile nell'elenco dei collaboratori)."},anl2Titel:{de:"2. Pr\xFCfpunkte bewerten",es:"2. Evaluar los puntos de control",pt:"2. Avaliar os pontos de verifica\xE7\xE3o",it:"2. Valutare i punti di verifica"},anl2P1:{de:"Pro Pr\xFCfpunkt eine der vier Bewertungen anklicken: \u2713 erf\xFCllt, \u25B3 teilweise erf\xFCllt, \u2715 nicht erf\xFCllt, oder \u2014 nicht gepr\xFCft/nicht relevant.",es:"Para cada punto de control, haga clic en una de las cuatro valoraciones: \u2713 cumplido, \u25B3 parcialmente cumplido, \u2715 no cumplido, o \u2014 no revisado/no relevante.",pt:"Para cada ponto de verifica\xE7\xE3o, clique numa das quatro avalia\xE7\xF5es: \u2713 cumprido, \u25B3 parcialmente cumprido, \u2715 n\xE3o cumprido, ou \u2014 n\xE3o verificado/n\xE3o relevante.",it:"Per ogni punto di verifica, cliccare una delle quattro valutazioni: \u2713 soddisfatto, \u25B3 parzialmente soddisfatto, \u2715 non soddisfatto, oppure \u2014 non verificato/non rilevante."},anl2P2:{de:'Bei \u25B3 oder \u2715 \xF6ffnet sich automatisch ein Abweichungsformular: Feststellung, Massnahme, Verantwortlich, Status, Termin. Bis zu 10 Fotos pro Abweichung k\xF6nnen hinzugef\xFCgt werden. \xDCber \u201EIm Kundenbericht" steuert man, ob eine Abweichung im PDF an den Kunden erscheint.',es:"Con \u25B3 o \u2715 se abre autom\xE1ticamente un formulario de desviaci\xF3n: observaci\xF3n, medida, responsable, estado, plazo. Se pueden a\xF1adir hasta 10 fotos por desviaci\xF3n. Con \xABEn el informe al cliente\xBB se controla si una desviaci\xF3n aparece en el PDF para el cliente.",pt:"Com \u25B3 ou \u2715 abre-se automaticamente um formul\xE1rio de desvio: observa\xE7\xE3o, medida, respons\xE1vel, estado, prazo. Podem ser adicionadas at\xE9 10 fotos por desvio. Com \xABNo relat\xF3rio ao cliente\xBB controla-se se um desvio aparece no PDF para o cliente.",it:"Con \u25B3 o \u2715 si apre automaticamente un modulo di scostamento: osservazione, misura, responsabile, stato, scadenza. Si possono aggiungere fino a 10 foto per scostamento. Con \xABNel rapporto al cliente\xBB si controlla se uno scostamento appare nel PDF per il cliente."},anl3Titel:{de:"3. Interner Bereich",es:"3. Zona interna",pt:"3. \xC1rea interna",it:"3. Area interna"},anl3P1:{de:"F\xFCr jede erfasste Reinigungskraft gibt es einen eigenen Bewertungsblock (Objektkenntnisse, Zeiterfassung, Arbeitskleidung, Verhalten, Sicherheit). Dieser Bereich ist rein intern und erscheint nie im Kundenbericht.",es:"Para cada persona de limpieza registrada hay un bloque de evaluaci\xF3n propio (conocimiento del objeto, registro de horas, ropa de trabajo, comportamiento, seguridad). Esta zona es puramente interna y nunca aparece en el informe al cliente.",pt:"Para cada colaborador de limpeza registado existe um bloco de avalia\xE7\xE3o pr\xF3prio (conhecimento do objeto, registo de horas, farda de trabalho, comportamento, seguran\xE7a). Esta \xE1rea \xE9 puramente interna e nunca aparece no relat\xF3rio ao cliente.",it:"Per ogni collaboratore delle pulizie registrato esiste un proprio blocco di valutazione (conoscenza dell'oggetto, rilevazione orari, abbigliamento da lavoro, comportamento, sicurezza). Quest'area \xE8 puramente interna e non compare mai nel rapporto al cliente."},anl4Titel:{de:"4. Abschluss & Kundenbericht",es:"4. Cierre e informe al cliente",pt:"4. Conclus\xE3o e relat\xF3rio ao cliente",it:"4. Conclusione e rapporto al cliente"},anl4P1:{de:"Nach dem Abschliessen wird automatisch ein kundenf\xE4higes PDF im offiziellen Clean-Service-Briefpapier-Layout erzeugt \u2014 bei mehreren Seiten tr\xE4gt jede Seite Logo, Fusszeile und Sparten-Leiste.",es:"Al cerrar se genera autom\xE1ticamente un PDF listo para el cliente con el dise\xF1o oficial del papel con membrete de Clean Service \u2014 si hay varias p\xE1ginas, cada una lleva el logotipo, el pie de p\xE1gina y la franja de servicios.",pt:"Ao concluir, \xE9 gerado automaticamente um PDF pronto para o cliente com o design oficial do papel timbrado da Clean Service \u2014 se houver v\xE1rias p\xE1ginas, cada uma tem o log\xF3tipo, o rodap\xE9 e a faixa de servi\xE7os.",it:"Alla conclusione viene generato automaticamente un PDF pronto per il cliente con il layout ufficiale della carta intestata Clean Service \u2014 se ci sono pi\xF9 pagine, ognuna riporta il logo, il pi\xE8 di pagina e la fascia dei servizi."},anl4P2:{de:'\xDCber \u201EAls PDF speichern" \xF6ffnet sich der Druckdialog des Browsers; dort \u201EAls PDF speichern" w\xE4hlen.',es:"Con \xABGuardar como PDF\xBB se abre el di\xE1logo de impresi\xF3n del navegador; all\xED seleccione \xABGuardar como PDF\xBB.",pt:"Com \xABGuardar como PDF\xBB abre-se a caixa de di\xE1logo de impress\xE3o do navegador; a\xED selecione \xABGuardar como PDF\xBB.",it:"Con \xABSalva come PDF\xBB si apre la finestra di stampa del browser; l\xEC selezionare \xABSalva come PDF\xBB."},anl5Titel:{de:"5. Admin-Bereich",es:"5. Zona de administraci\xF3n",pt:"5. \xC1rea de administra\xE7\xE3o",it:"5. Area amministrativa"},anl5P1:{de:"Zeigt Dashboard, Objektliste mit Verlauf, offene Aufgaben und die Mitarbeiterbewertungen \xFCber alle Kontrollen hinweg. Mitarbeitende mit schwachen Bewertungen werden rot markiert.",es:"Muestra el panel, la lista de objetos con historial, las tareas pendientes y las valoraciones del personal a lo largo de todos los controles. El personal con valoraciones bajas se marca en rojo.",pt:"Mostra o painel, a lista de objetos com hist\xF3rico, as tarefas pendentes e as avalia\xE7\xF5es dos colaboradores ao longo de todos os controlos. Os colaboradores com avalia\xE7\xF5es fracas s\xE3o marcados a vermelho.",it:"Mostra la dashboard, l'elenco degli oggetti con lo storico, le attivit\xE0 aperte e le valutazioni del personale su tutti i controlli. Il personale con valutazioni scarse viene evidenziato in rosso."},anl5P2:{de:"Objekte k\xF6nnen hier hinzugef\xFCgt oder entfernt werden.",es:"Aqu\xED se pueden a\xF1adir o eliminar objetos.",pt:"Aqui podem ser adicionados ou removidos objetos.",it:"Qui \xE8 possibile aggiungere o rimuovere oggetti."},anlSpracheTitel:{de:"Sprache",es:"Idioma",pt:"Idioma",it:"Lingua"},anlSpracheP1:{de:"Die Sprachauswahl \xFCbersetzt nur die Bedienoberfl\xE4che f\xFCr das Reinigungspersonal (Deutsch, Espa\xF1ol, Portugu\xEAs, Italiano). Der Kundenbericht (PDF) bleibt immer auf Deutsch, unabh\xE4ngig von der gew\xE4hlten Sprache.",es:"La selecci\xF3n de idioma solo traduce la interfaz de uso para el personal de limpieza (alem\xE1n, espa\xF1ol, portugu\xE9s, italiano). El informe al cliente (PDF) permanece siempre en alem\xE1n, independientemente del idioma elegido.",pt:"A sele\xE7\xE3o de idioma traduz apenas a interface de utiliza\xE7\xE3o para o pessoal de limpeza (alem\xE3o, espanhol, portugu\xEAs, italiano). O relat\xF3rio ao cliente (PDF) permanece sempre em alem\xE3o, independentemente do idioma escolhido.",it:"La selezione della lingua traduce solo l'interfaccia utente per il personale delle pulizie (tedesco, spagnolo, portoghese, italiano). Il rapporto al cliente (PDF) resta sempre in tedesco, indipendentemente dalla lingua scelta."},imKundenbericht:{de:"Im Kundenbericht:",es:"En el informe al cliente:",pt:"No relat\xF3rio ao cliente:",it:"Nel rapporto al cliente:"},zurueck:{de:"Zur\xFCck",es:"Atr\xE1s",pt:"Voltar",it:"Indietro"},weiterZumInternenBereich:{de:"Weiter zum internen Bereich",es:"Continuar a la zona interna",pt:"Continuar para a \xE1rea interna",it:"Continua all'area interna"},internerBereichTitle:{de:"Interner Bereich",es:"Zona interna",pt:"\xC1rea interna",it:"Area interna"},internerBereichHint:{de:"Nur intern sichtbar \u2014 erscheint niemals im Kunden-PDF und fliesst nicht in den Qualit\xE4tswert ein.",es:"Visible solo internamente \u2014 nunca aparece en el PDF del cliente ni influye en el valor de calidad.",pt:"Apenas vis\xEDvel internamente \u2014 nunca aparece no PDF do cliente nem influencia o valor de qualidade.",it:"Visibile solo internamente \u2014 non compare mai nel PDF per il cliente e non influisce sul valore di qualit\xE0."},keinMitarbeiterErfasst:{de:"Kein Reinigungspersonal erfasst",es:"No se ha registrado personal de limpieza",pt:"Nenhum pessoal de limpeza registado",it:"Nessun personale delle pulizie registrato"},objektkenntnisse:{de:"Mitarbeiter / Objektkenntnisse",es:"Personal / Conocimiento del objeto",pt:"Colaborador / Conhecimento do objeto",it:"Collaboratore / Conoscenza dell'oggetto"},kenntObje
